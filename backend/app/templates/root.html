<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrustVault AI</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --border: #2d3a4d;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #5eead4;
      --accent2: #818cf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(129, 140, 248, 0.25), transparent),
        radial-gradient(ellipse 60% 40% at 100% 50%, rgba(94, 234, 212, 0.12), transparent),
        var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
    }
    .wrap { max-width: 520px; margin: 0 auto; }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 0.25rem;
    }
    .ver { color: var(--muted); font-size: 0.85rem; margin-bottom: 1.5rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem 1.35rem;
      margin-bottom: 1.25rem;
    }
    .card h2 {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin: 0 0 0.75rem;
      font-weight: 600;
    }
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
      padding: 0.45rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    li:last-child { border-bottom: none; }
    input[type="checkbox"] {
      width: 1.1rem;
      height: 1.1rem;
      margin-top: 0.15rem;
      accent-color: var(--accent);
      cursor: default;
    }
    .row-body { flex: 1; min-width: 0; }
    .row-body strong { display: block; font-size: 0.95rem; }
    .row-body code {
      font-size: 0.8rem;
      color: var(--accent);
      word-break: break-all;
    }
    .row-body a {
      color: var(--accent2);
      text-decoration: none;
    }
    .row-body a:hover { text-decoration: underline; }
    pre {
      margin: 0;
      padding: 1rem;
      background: #0a0e14;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.78rem;
      line-height: 1.5;
      overflow-x: auto;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>TrustVault AI</h1>
    <p class="ver">Backend API · v{{ version }}</p>

    <div class="card">
      <h2>Endpoints</h2>
      <ul>
        <li>
          <input type="checkbox" checked disabled aria-label="OpenAPI docs available" />
          <div class="row-body">
            <strong>OpenAPI docs</strong>
            <a href="/docs"><code>/docs</code></a>
          </div>
        </li>
        <li>
          <input type="checkbox" checked disabled aria-label="Health check available" />
          <div class="row-body">
            <strong>Health</strong>
            <a href="/health"><code>/health</code></a>
          </div>
        </li>
        <li>
          <input type="checkbox" checked disabled aria-label="Analyze endpoint" />
          <div class="row-body">
            <strong>Analyze payment</strong>
            <code>POST /analyze</code> <span style="color:var(--muted);font-size:0.8rem;">(use Swagger or curl)</span>
          </div>
        </li>
      </ul>
    </div>

    <div class="card">
      <h2>Metadata (pretty JSON)</h2>
      <pre id="json">{{ json_pretty }}</pre>
    </div>
  </div>
</body>
</html>
